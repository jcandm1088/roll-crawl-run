name: Deploy to GitHub Pages

# Deployment is MANUAL ONLY. Pushing to any branch never publishes the app.
# To deploy: GitHub → Actions → "Deploy to GitHub Pages" → Run workflow,
# then type "deploy" in the confirmation box.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish the current main branch to GitHub Pages'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
